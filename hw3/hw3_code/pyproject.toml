[project]
name = "HW3"
version = "0.1.0"
description = "CS4644/7643 HW3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "matplotlib==3.10.6",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "pyyaml==6.0.2",
  "ipykernel==6.30.1",
  "nbconvert[webpdf]==7.16.6",
  "datasets==3.6.0",
  "tokenizers>=0.22.1",
  "sacrebleu>=2.5.1",
  "pytest>=8.4.2",
  "jaxtyping>=0.3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Ignore linting rules for jaxtyping
ignore = ["F722"]
